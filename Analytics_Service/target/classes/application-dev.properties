spring.application.name=ANALYTICS-SERVICE


server.port=8086


spring.datasource.url=jdbc:mysql://localhost:3306/db_analytics
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


spring.flyway.enabled=false

jwt.secret=clave-super-secreta-para-clase-123456

# ── Eureka Client ─────────────────────────────────────────────────
# URL donde esta publicado Eureka Server.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# true = este microservicio se registra en Eureka al iniciar.
eureka.client.register-with-eureka=true

# true = permite consultar el registro de otros servicios.
eureka.client.fetch-registry=true

# Publica la IP del servicio en Eureka en vez del hostname.
eureka.instance.prefer-ip-address=true

# ── Logging ───────────────────────────────────────────────────────────
logging.file.name=logs/app.log
