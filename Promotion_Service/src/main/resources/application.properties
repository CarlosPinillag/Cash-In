spring.application.name=PromotionService

server.port=8089

spring.datasource.url=jdbc:mysql://localhost:3306/db_promotions
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway 
# Flyway maneja migraciones de BD con scripts SQL versionados
# uso de  ddl-auto=update se mantiene desactivado:
# spring.flyway.enabled=false

jwt.secret=clave-super-secreta-para-clase-123456

auth-service.base-url=${AUTH_SERVICE_URL:http://localhost:8081}