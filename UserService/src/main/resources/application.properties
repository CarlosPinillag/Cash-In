spring.application.name=UserService

# Puerto — cada microservicio tiene su propio puerto
server.port=8080

# ── Conexión a MySQL ─────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/db_users
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────
# update: crea/actualiza tablas automáticamente. Nunca borra datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ──────────────────────────────────────────────────
# Flyway maneja migraciones de BD con scripts SQL versionados
# Si usas ddl-auto=update puedes desactivarlo por ahora:
spring.flyway.enabled=false
