# Puerto público del Gateway.
# Desde ahora el cliente/Postman debería llamar a http://localhost:8090
# (Se usa 8090 para no chocar con UserService que ya está en 8080)
server:
  port: 8090

spring:
  application:
    # Nombre con el que el Gateway se registra en Eureka.
    name: API-GATEWAY

  cloud:
    gateway:
      server:
        webmvc:
          # Lista de rutas que el Gateway conoce.
          # Cada microservicio expuesto al cliente tiene una entrada aquí.
          # lb:// indica que el destino se resuelve con Eureka (Service Discovery).
          routes:

            # USER-SERVICE :8080
            # Rutas públicas de usuarios
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v1/users/**

            # AUTH-SERVICE :8081
            # Login, logout y validación de token
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**

            # EXPENSE-SERVICE :8082
            # Gastos del usuario
            - id: expense-service
              uri: lb://EXPENSE-SERVICE
              predicates:
                - Path=/api/v1/expenses/**

            # INCOME-SERVICE :8083
            # Ingresos del usuario
            - id: income-service
              uri: lb://INCOME-SERVICE
              predicates:
                - Path=/api/v1/incomes/**

            # BUDGET-SERVICE :8084
            # Presupuestos y seguimiento de gasto
            - id: budget-service
              uri: lb://BUDGET-SERVICE
              predicates:
                - Path=/api/v1/budgets/**

            # CATEGORY-SERVICE :8085
            # Categorías financieras
            - id: category-service
              uri: lb://CATEGORY-SERVICE
              predicates:
                - Path=/api/v1/categories/**

            # ANALYTICS-SERVICE :8086
            # Reportes y estadísticas financieras
            - id: analytics-service
              uri: lb://ANALYTICS-SERVICE
              predicates:
                - Path=/api/v1/analytics/**

            # ALERT-SERVICE :8087
            # Alertas automáticas de presupuesto
            - id: alert-service
              uri: lb://ALERT-SERVICE
              predicates:
                - Path=/api/v1/alerts/**

            # NOTIFICATION-SERVICE :8088
            # Notificaciones al usuario
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notifications/**

            # PROMOTION-SERVICE :8089
            # Promociones y recomendaciones de ahorro
            - id: promotion-service
              uri: lb://PROMOTION-SERVICE
              predicates:
                - Path=/api/v1/promotions/**

eureka:
  client:
    service-url:
      # Dirección donde el Gateway encuentra a Eureka Server.
      defaultZone: http://localhost:8761/eureka/

    # true = registra el Gateway como otro servicio visible en Eureka.
    register-with-eureka: true

    # true = descarga el registro para resolver lb://NOMBRE-SERVICE.
    fetch-registry: true
