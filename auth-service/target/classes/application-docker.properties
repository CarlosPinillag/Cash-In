spring.application.name=AuthService

# Puerto interno
server.port=8081

# Conexión a MySQL en Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/db_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway creará las tablas ahora
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ACTIVAR FLYWAY 
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Clave JWT
jwt.secret=${JWT_SECRET:clave-super-secreta-para-clase-123456}
jwt.expiration=${JWT_EXPIRATION:3600000}

user-service.base-url=${USER_SERVICE_URL:http://localhost:8080}